<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Hastening | Launching Soon</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

      body{

    font-family:'Poppins',sans-serif;

    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow:hidden;

    background:
        radial-gradient(circle at top,
            rgba(255,214,102,.45) 0%,
            rgba(255,214,102,.15) 18%,
            transparent 45%),
        linear-gradient(180deg,
            #9c9c9c 0%,
            #7d7d7d 50%,
            #5f5f5f 100%);
}

        .coming-box{

            width:100%;
            max-width:620px;

            background:#ffffff;

            border-radius:24px;

            padding:50px 40px;

            text-align:center;

            box-shadow:
            0 15px 45px rgba(0,0,0,.08);

        }

        .logo{

            width:170px;
            max-width:100%;

            margin-bottom:25px;

        }

        .coming-box h3{

            font-size:38px;

            font-weight:700;

            color:#1d3557;

            margin-bottom:20px;

        }

        .coming-box p{

            font-size:17px;

            color:#6c757d;

            line-height:1.8;

            margin-bottom:35px;

        }

        /* Loader */

        .loader{

            display:flex;

            justify-content:center;

            align-items:center;

            gap:12px;

        }

        .loader span{

            width:14px;
            height:14px;

            background:#0d6efd;

            border-radius:50%;

            animation:bounce 1.2s infinite;

        }

        .loader span:nth-child(2){

            animation-delay:.2s;

        }

        .loader span:nth-child(3){

            animation-delay:.4s;

        }

        @keyframes bounce{

            0%,80%,100%{

                transform:translateY(0);
                opacity:.4;

            }

            40%{

                transform:translateY(-14px);
                opacity:1;

            }

        }

        footer{

            margin-top:35px;

            text-align:center;

            font-size:15px;

            color:#fff;

            line-height:1.8;

        }

        footer strong{

            color:#fff;

        }

        /* ========================= */

        /* Tablet */

        /* ========================= */

        @media (max-width:991px){

            .coming-box{

                max-width:550px;

                padding:45px 35px;

            }

            .coming-box h3{

                font-size:34px;

            }

            .coming-box p{

                font-size:16px;

            }

            .logo{

                width:120px;

            }

        }

        /* ========================= */

        /* Mobile */

        /* ========================= */

        @media (max-width:767px){

            body{

                padding:18px;

            }

            .coming-box{

                padding:35px 25px;

                border-radius:20px;

            }

            .logo{

                width:300px;

                margin-bottom:20px;

            }

            .coming-box h3{

                font-size:28px;

                margin-bottom:15px;

            }

            .coming-box p{

                font-size:15px;

                line-height:1.7;

                margin-bottom:30px;

            }

            .loader span{

                width:12px;
                height:12px;

            }

            footer{

                font-size:14px;

                padding:0 15px;

            }

        }

        /* ========================= */

        /* Small Mobile */

        /* ========================= */

        @media (max-width:480px){

            .coming-box{

                padding:30px 20px;

            }

            .logo{

                width:250px;

            }

            .coming-box h3{

                font-size:24px;

            }

            .coming-box p{

                font-size:14px;

            }

            footer{

                font-size:13px;

            }

        }

        /* ========================= */

        /* Large Desktop */

        /* ========================= */

        @media (min-width:1600px){

            .coming-box{

                max-width:720px;

                padding:60px;

            }

            .coming-box h3{

                font-size:46px;

            }

            .coming-box p{

                font-size:20px;

            }

            .logo{

                width:150px;

            }

        }

    </style>

</head>

<body>

    <div class="coming-box">

        <img src="assets/logo.png"
             class="logo"
             alt="Hastening Logo">

        <h3>Launching Soon</h3>

        <p>

            Our website is currently under construction.<br>

         

        </p>

        <div class="loader">

            <span></span>

            <span></span>

            <span></span>

        </div>

    </div>

    <footer>

        © 2026 <strong>Hastening</strong>. All Rights Reserved.<br>

        Website Developed &amp; Maintained by <strong> </br>SIAT International</strong>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
